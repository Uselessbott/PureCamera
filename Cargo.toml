[package]
name = "pure-camera"
version = "0.1.0"
edition = "2021"
description = "Minimal, privacy-focused, pure-Rust Android camera using Camera2 NDK"
license = "MIT OR Apache-2.0"
publish = false
# NativeActivity is the only Activity; do not build a Rust binary target.
autobins = false

[lib]
name = "pure_camera"
# NativeActivity loads this cdylib directly. There is no Java/Kotlin source.
crate-type = ["cdylib"]

[dependencies]
# 0.6.1 is required for AndroidApp::run_on_java_main_thread, which keeps
# permission requests off the android_main thread.
android-activity = { version = "0.6.1", default-features = false, features = ["native-activity"] }
jni = "0.21"
ndk = "0.9"
# `media` links libmediandk (AImageReader); `nativewindow` links libnativewindow.
ndk-sys = { version = "0.6", features = ["media", "nativewindow"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
