name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018
  GRADLE_VERSION: 8.9

jobs:
  build:
    name: Build all Rust ABIs and unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Export Android SDK and NDK paths
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not set" >&2
            exit 1
          fi
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_ROOT" ]; then
            echo "NDK not found at $NDK_ROOT" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "NDK_HOME=$NDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build libpure_camera.so for all ABIs
        run: |
          cargo ndk \
            -p 29 \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release

      - name: Verify packaged ABI outputs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="android/app/src/main/jniLibs/$abi/libpure_camera.so"
            if [ ! -f "$so" ]; then
              echo "Missing $so" >&2
              exit 1
            fi
          done

      - name: Assemble unsigned release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: purecamera-unsigned-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
