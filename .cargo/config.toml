# cargo-ndk aliases. These only describe commands; nothing is executed here.
[alias]
android = [
    "ndk",
    "-t", "arm64-v8a",
    "-t", "armeabi-v7a",
    "-t", "x86_64",
    "-o", "android/app/src/main/jniLibs",
    "build",
    "--release",
]
android-arm64 = [
    "ndk",
    "-t", "arm64-v8a",
    "-o", "android/app/src/main/jniLibs",
    "build",
    "--release",
]
